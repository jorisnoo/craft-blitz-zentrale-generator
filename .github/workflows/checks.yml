name: Package CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, intl, mbstring, pdo, zip
          tools: composer:v2
          coverage: none
      - run: composer validate --strict --no-check-lock --no-plugins
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: composer test

  gate:
    name: Package checks
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all PHP versions
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
